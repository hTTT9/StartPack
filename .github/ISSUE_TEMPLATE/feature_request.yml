name: Идея
description: Предложить новую возможность или улучшение
labels: [идея]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что хочется
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем
      description: Какую задачу это решит.
